<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora The Shampoo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white shadow-xs sticky top-0 z-40 border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl font-black bg-gradient-to-r from-pink-500 to-violet-600 bg-clip-text text-transparent tracking-tight">The Shampoo</span>
                <span class="text-xs font-semibold uppercase tracking-wider bg-violet-100 text-violet-700 px-2 py-0.5 rounded-full">Distribuidora</span>
            </div>
            <div class="flex items-center gap-4">
                <button id="admin-login-btn" onclick="toggleAdminLogin()" class="text-sm font-medium text-slate-500 hover:text-slate-800 transition cursor-pointer">Panel Admin</button>
                <button onclick="toggleCart()" class="relative p-2 text-slate-600 hover:text-violet-600 transition cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                    </svg>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-pink-500 text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <div id="admin-auth-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 relative border border-slate-100">
            <button onclick="toggleAdminLogin()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 cursor-pointer">✕</button>
            <h3 class="text-xl font-bold text-slate-800 mb-4">Acceso Administrativo</h3>
            <input type="password" id="admin-password" placeholder="Contraseña de fábrica: admin" class="w-full px-4 py-2.5 border border-slate-200 rounded-xl mb-4 focus:outline-none focus:border-violet-500 text-sm">
            <button onclick="loginAdmin()" class="w-full bg-gradient-to-r from-pink-500 to-violet-600 text-white font-semibold py-2.5 rounded-xl text-sm shadow-md cursor-pointer hover:opacity-95 transition">Ingresar</button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        
        <div id="admin-panel" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-8 hidden">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-6">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">Panel de Administración de Productos</h2>
                    <p class="text-xs text-slate-400">Agrega, edita o elimina productos del catálogo</p>
                </div>
                <button onclick="logoutAdmin()" class="text-xs font-semibold text-rose-600 hover:underline cursor-pointer">Cerrar Sesión</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Nombre del Producto</label>
                    <input type="text" id="prod-name" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-violet-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Categoría</label>
                    <input type="text" id="prod-category" placeholder="Ej: Shampoo, Tintes..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-violet-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Precio ($)</label>
                    <input type="number" step="0.01" id="prod-price" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-violet-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">URL de la Imagen</label>
                    <input type="text" id="prod-img" placeholder="https://..." class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-violet-500">
                </div>
            </div>
            
            <div class="flex justify-between items-center">
                <button onclick="resetData()" class="text-xs text-slate-400 hover:text-rose-600 transition cursor-pointer border border-slate-200 px-3 py-1.5 rounded-lg hover:border-rose-200">Restablecer de Fábrica</button>
                <div class="flex gap-2">
                    <button id="cancel-edit-btn" onclick="cancelEdit()" class="px-4 py-2 bg-slate-100 text-slate-600 font-medium text-xs rounded-lg hover:bg-slate-200 cursor-pointer hidden">Cancelar Edición</button>
                    <button id="save-product-btn" onclick="saveProduct()" class="px-4 py-2 bg-violet-600 text-white font-medium text-xs rounded-lg hover:bg-violet-700 shadow-xs cursor-pointer">Guardar Producto</button>
                </div>
            </div>
        </div>

        <div class="mb-8 overflow-x-auto pb-2 scrollbar-none">
            <div id="categories-nav" class="flex gap-2 whitespace-nowrap">
                </div>
        </div>

        <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 sm:gap-6">
            </div>
    </main>

    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full max-w-md bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 border-l border-slate-100 flex flex-col">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <h3 class="text-lg font-bold text-slate-800">Tu Pedido</h3>
                <span id="cart-badge-count" class="bg-slate-100 text-slate-700 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
            </div>
            <button onclick="toggleCart()" class="text-slate-400 hover:text-slate-600 text-xl cursor-pointer">✕</button>
        </div>
        
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4">
            </div>
        
        <div class="p-6 border-t border-slate-100 bg-slate-50">
            <div class="flex justify-between items-center mb-4">
                <span class="text-sm font-medium text-slate-500">Total a pagar:</span>
                <span id="cart-total" class="text-2xl font-black text-slate-800">$0.00</span>
            </div>
            <button onclick="sendWhatsAppOrder()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-md hover:bg-emerald-700 transition flex items-center justify-center gap-2 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-5 h-5"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.734-1.456L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.42 9.864-9.858.002-2.634-1.023-5.11-2.885-6.974C16.526 1.949 14.053.924 11.42.923c-5.44 0-9.866 4.421-9.87 9.86-.001 1.716.452 3.39 1.312 4.869l-1.02 3.722 3.805-.998z"/></svg>
                Confirmar por WhatsApp
            </button>
        </div>
    </div>

    <footer class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400 mt-auto">
        <p>© 2026 Distribuidora The Shampoo. Todos los derechos reservados.</p>
    </footer>

    <script>
        const defaultSettings = { password: "admin" };
        const defaultProducts = [
            { id: 1, name: "Shampoo Profesional Keratina 1L", category: "Shampoo", price: 12.50, img: "https://images.unsplash.com/photo-1535585209827-a15fcdbc4c2d?w=500&q=80" },
            { id: 2, name: "Acondicionador Brillo Argán 1L", category: "Acondicionador", price: 13.00, img: "https://images.unsplash.com/photo-1526947425960-945c6e72858f?w=500&q=80" },
            { id: 3, name: "Baño de Crema Hidratación Coco 500g", category: "Tratamiento", price: 8.50, img: "https://images.unsplash.com/photo-1608248597481-496100c80836?w=500&q=80" },
            { id: 4, name: "Ampollas Anticaída Caja x12", category: "Ampollas", price: 15.00, img: "https://images.unsplash.com/photo-1601049541289-9b1b7bbbfe19?w=500&q=80" }
        ];

        // Variable global principal de productos
        let products = JSON.parse(localStorage.getItem("ts_products")) || defaultProducts;
        
        if(!localStorage.getItem("ts_products")) localStorage.setItem("ts_products", JSON.stringify(defaultProducts));
        if(!localStorage.getItem("ts_settings")) localStorage.setItem("ts_settings", JSON.stringify(defaultSettings));

        let cart = [];
        let currentCategory = "Todos";
        let isAdminLoggedIn = false;
        let editingProductId = null;

        function toggleAdminLogin() {
            const modal = document.getElementById("admin-auth-modal");
            modal.classList.toggle("hidden");
            document.getElementById("admin-password").value = "";
        }

        function loginAdmin() {
            const pass = document.getElementById("admin-password").value;
            const settings = JSON.parse(localStorage.getItem("ts_settings"));
            if(pass === settings.password) {
                isAdminLoggedIn = true;
                toggleAdminLogin();
                document.getElementById("admin-panel").classList.remove("hidden");
                document.getElementById("admin-login-btn").textContent = "Panel Activo";
                refreshUI();
            } else {
                alert("Contraseña incorrecta");
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            document.getElementById("admin-panel").classList.add("hidden");
            document.getElementById("admin-login-btn").textContent = "Panel Admin";
            cancelEdit();
            refreshUI();
        }

        function toggleCart() {
            const sidebar = document.getElementById("cart-sidebar");
            sidebar.classList.toggle("translate-x-full");
        }

        function filterCategory(cat) {
            currentCategory = cat;
            refreshUI();
        }

        function refreshUI() {
            // 1. Renderizar Categorías de forma limpia y sin duplicados
            const catNav = document.getElementById("categories-nav");
            catNav.innerHTML = "";
            
            let categories = ["Todos"];
            products.forEach(p => {
                if(p.category) {
                    const cleanCat = p.category.trim();
                    // Evita duplicados ignorando diferencias de mayúsculas/minúsculas o espacios accidentales
                    if(!categories.some(c => c.toLowerCase() === cleanCat.toLowerCase())) {
                        categories.push(cleanCat);
                    }
                }
            });

            // Resguardo por si se elimina una categoría activa entera
            if(!categories.some(c => c.toLowerCase() === currentCategory.toLowerCase())) {
                currentCategory = "Todos";
            }

            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.className = `px-4 py-1.5 text-xs font-semibold rounded-full transition pacing-wide cursor-pointer border ${
                    currentCategory.toLowerCase() === cat.toLowerCase()
                    ? "bg-gradient-to-r from-pink-500 to-violet-600 text-white border-transparent shadow-xs" 
                    : "bg-white text-slate-600 border-slate-200 hover:border-slate-300"
                }`;
                btn.textContent = cat;
                btn.onclick = () => filterCategory(cat);
                catNav.appendChild(btn);
            });

            // 2. Renderizar Productos en el Grid con imágenes perfectamente simétricas
            const grid = document.getElementById("products-grid");
            grid.innerHTML = "";

            const filtered = currentCategory === "Todos" 
                ? products 
                : products.filter(p => p.category && p.category.trim().toLowerCase() === currentCategory.toLowerCase());

            filtered.forEach(p => {
                const card = document.createElement("div");
                card.className = "bg-white rounded-2xl border border-slate-100 shadow-xs overflow-hidden flex flex-col group relative";
                
                // Contenedor 'aspect-square' e imagen con 'object-cover' asegura tamaño idéntico sin deformaciones
                card.innerHTML = `
                    <div class="relative bg-slate-100 overflow-hidden w-full aspect-square flex items-center justify-center">
                        <img src="${p.img || 'https://images.unsplash.com/photo-1535585209827-a15fcdbc4c2d?w=500&q=80'}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300 ease-in-out">
                        ${isAdminLoggedIn ? `
                            <div class="absolute top-2 right-2 flex gap-1 z-10">
                                <button onclick="editProduct(${p.id})" class="p-1.5 bg-white/90 backdrop-blur-xs rounded-lg text-slate-600 hover:text-violet-600 shadow-xs transition text-xs font-bold cursor-pointer">✏️</button>
                                <button onclick="deleteProduct(${p.id})" class="p-1.5 bg-white/90 backdrop-blur-xs rounded-lg text-rose-600 hover:bg-rose-50 shadow-xs transition text-xs font-bold cursor-pointer">🗑️</button>
                            </div>
                        ` : ''}
                    </div>
                    <div class="p-4 flex flex-col flex-1 justify-between gap-3">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">${p.category}</span>
                            <h4 class="text-sm font-bold text-slate-800 line-clamp-2 mt-0.5">${p.name}</h4>
                        </div>
                        <div class="flex items-center justify-between mt-auto">
                            <span class="text-base font-black text-slate-900">$${parseFloat(p.price).toFixed(2)}</span>
                            <button onclick="addToCart(${p.id})" class="px-3 py-1.5 bg-slate-900 hover:bg-violet-600 text-white font-semibold text-xs rounded-lg shadow-xs transition flex items-center gap-1 cursor-pointer">
                                <span>Agregar</span>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            // 3. Renderizar Carrito
            const cartItemsContainer = document.getElementById("cart-items");
            cartItemsContainer.innerHTML = "";
            let total = 0;
            let totalCount = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                totalCount += item.quantity;

                const itemDiv = document.createElement("div");
                itemDiv.className = "flex items-center gap-3 border-b border-slate-100 pb-3";
                itemDiv.innerHTML = `
                    <img src="${item.img || 'https://images.unsplash.com/photo-1535585209827-a15fcdbc4c2d?w=500&q=80'}" class="w-12 h-12 object-cover rounded-lg bg-slate-100">
                    <div class="flex-1">
                        <h5 class="text-xs font-bold text-slate-800 line-clamp-1">${item.name}</h5>
                        <span class="text-xs font-semibold text-slate-500">$${item.price.toFixed(2)} x ${item.quantity}</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="updateQuantity(${item.id}, -1)" class="w-6 h-6 flex items-center justify-center border border-slate-200 rounded-md text-xs font-bold hover:bg-slate-50 cursor-pointer">-</button>
                        <button onclick="updateQuantity(${item.id}, 1)" class="w-6 h-6 flex items-center justify-center border border-slate-200 rounded-md text-xs font-bold hover:bg-slate-50 cursor-pointer">+</button>
                    </div>
                `;
                cartItemsContainer.appendChild(itemDiv);
            });

            const badge = document.getElementById("cart-count");
            const sideBadge = document.getElementById("cart-badge-count");
            badge.textContent = totalCount;
            sideBadge.textContent = totalCount;
            
            if(totalCount > 0) {
                badge.classList.remove("hidden");
            } else {
                badge.classList.add("hidden");
            }
            document.getElementById("cart-total").textContent = `$${total.toFixed(2)}`;
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            if(!prod) return;
            
            const existing = cart.find(item => item.id === id);
            if(existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...prod, quantity: 1 });
            }
            refreshUI();
        }

        function updateQuantity(id, delta) {
            const item = cart.find(i => i.id === id);
            if(!item) return;
            
            item.quantity += delta;
            if(item.quantity <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            refreshUI();
        }

        function sendWhatsAppOrder() {
            if(cart.length === 0) {
                alert("Tu carrito está vacío");
                return;
            }
            
            let message = "*¡Hola! Me gustaría realizar el siguiente pedido en Distribuidora The Shampoo:*\n\n";
            let total = 0;
            
            cart.forEach(item => {
                const subtotal = item.price * item.quantity;
                message += `▪️ *${item.name}*\n  ${item.quantity}x $${item.price.toFixed(2)} = *$${subtotal.toFixed(2)}*\n`;
                total += subtotal;
            });
            
            message += `\n💵 *Total a pagar: $${total.toFixed(2)}*`;
            window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, "_blank");
        }

        function editProduct(id) {
            const p = products.find(prod => prod.id === id);
            if(p) {
                editingProductId = id;
                document.getElementById("prod-name").value = p.name;
                document.getElementById("prod-category").value = p.category;
                document.getElementById("prod-price").value = p.price;
                document.getElementById("prod-img").value = p.img || "";
                
                document.getElementById("cancel-edit-btn").classList.remove("hidden");
                document.getElementById("save-product-btn").textContent = "Actualizar Producto";
                document.getElementById("admin-panel").scrollIntoView({ behavior: 'smooth' });
            }
        }

        function cancelEdit() {
            editingProductId = null;
            document.getElementById("prod-name").value = "";
            document.getElementById("prod-category").value = "";
            document.getElementById("prod-price").value = "";
            document.getElementById("prod-img").value = "";
            document.getElementById("cancel-edit-btn").classList.add("hidden");
            document.getElementById("save-product-btn").textContent = "Guardar Producto";
        }

        function saveProduct() {
            const name = document.getElementById("prod-name").value.trim();
            const category = document.getElementById("prod-category").value.trim();
            const price = parseFloat(document.getElementById("prod-price").value);
            const img = document.getElementById("prod-img").value.trim();

            if(!name || !category || isNaN(price)) {
                alert("Por favor completa los campos obligatorios (Nombre, Categoría y Precio)");
                return;
            }

            // Sincronización correcta leyendo del localStorage
            let storedProducts = JSON.parse(localStorage.getItem("ts_products")) || defaultProducts;

            if(editingProductId) {
                storedProducts = storedProducts.map(p => p.id === editingProductId ? { ...p, name, category, price, img } : p);
                editingProductId = null;
                document.getElementById("cancel-edit-btn").classList.add("hidden");
                document.getElementById("save-product-btn").textContent = "Guardar Producto";
            } else {
                const newId = storedProducts.length > 0 ? Math.max(...storedProducts.map(p => p.id)) + 1 : 1;
                storedProducts.push({ id: newId, name, category, price, img });
            }

            // Guardar cambios y actualizar de inmediato la variable global en memoria activa
            localStorage.setItem("ts_products", JSON.stringify(storedProducts));
            products = storedProducts;

            // Limpieza del formulario
            document.getElementById("prod-name").value = "";
            document.getElementById("prod-category").value = "";
            document.getElementById("prod-price").value = "";
            document.getElementById("prod-img").value = "";

            refreshUI();
        }

        function deleteProduct(id) {
            if(confirm("¿Estás seguro de que deseas eliminar este producto?")) {
                let storedProducts = JSON.parse(localStorage.getItem("ts_products")) || [];
                storedProducts = storedProducts.filter(p => p.id !== id);
                
                // Guardar cambios y actualizar la variable global en memoria activa
                localStorage.setItem("ts_products", JSON.stringify(storedProducts));
                products = storedProducts;
                
                refreshUI();
            }
        }

        function resetData() {
            if(confirm("Se borrarán tus modificaciones, se restablecerá la contraseña de fábrica ('admin') y volverán los productos muestra. ¿Proceder?")) {
                localStorage.clear();
                localStorage.setItem("ts_settings", JSON.stringify(defaultSettings));
                localStorage.setItem("ts_products", JSON.stringify(defaultProducts));
                
                // Actualización limpia de estados globales
                products = [...defaultProducts];
                currentCategory = "Todos";
                cart = [];
                isAdminLoggedIn = false;
                cancelEdit();
                
                const panel = document.getElementById("admin-panel");
                if (!panel.classList.contains("hidden")) panel.classList.add("hidden");
                document.getElementById("admin-login-btn").textContent = "Panel Admin";
                
                refreshUI();
            }
        }

        // Carga Inicial
        window.onload = function() {
            refreshUI();
        };
    </script>
</body>
</html>
