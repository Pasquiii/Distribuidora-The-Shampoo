<!DOCTYPE html>
<html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora The Shampoo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <header class="bg-white shadow-md sticky top-0 z-40">
        <div class="bg-[#D21427] h-2 w-full"></div>
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-[#6BA4D9] text-white p-2 rounded-lg">
                    <i class="fas fa-pump-soap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-none text-gray-900">The Shampoo</h1>
                    <p class="text-[10px] uppercase tracking-wider text-gray-500 font-semibold">Distribuidora</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <a id="btn-insta-head" target="_blank" class="text-gray-400 hover:text-[#E1306C] transition">
                    <i class="fab fa-instagram text-xl"></i>
                </a>
                <a id="btn-wats-head" target="_blank" class="text-gray-400 hover:text-[#25D366] transition">
                    <i class="fab fa-whatsapp text-xl"></i>
                </a>
                <button onclick="toggleCartModal()" class="relative bg-gray-100 p-2 rounded-full hover:bg-gray-200 transition cursor-pointer">
                    <i class="fas fa-shopping-cart text-gray-700"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-[#D21427] text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>

        <div class="border-t border-gray-100 bg-white">
            <div id="category-list" class="max-w-7xl mx-auto px-4 py-2 flex space-x-2 overflow-x-auto no-scrollbar items-center">
                </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        <div class="flex items-center justify-between mb-6">
            <h2 id="section-title" class="text-xl md:text-2xl font-bold text-gray-800 border-l-4 border-[#6BA4D9] pl-3">Todos los Productos</h2>
            <span id="product-count" class="text-xs md:text-sm bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-medium">0 Productos</span>
        </div>

        <div id="grid-productos" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-6"></div>

        <div id="no-products-msg" class="hidden text-center py-12">
            <i class="fas fa-box-open text-gray-300 text-5xl mb-3"></i>
            <p class="text-gray-500 font-medium">No hay productos aquí.</p>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-6 mt-12 text-center text-xs text-gray-500">
        <p>© 2026 Distribuidora The Shampoo. Todos los derechos reservados.</p>
    </footer>

    <button onclick="toggleAdminPanel()" class="fixed bottom-4 left-4 bg-gray-800 text-white w-10 h-10 rounded-full shadow-lg hover:bg-black transition flex items-center justify-center z-50 opacity-60 hover:opacity-100 cursor-pointer">
        <i class="fas fa-cog"></i>
    </button>

    <div id="admin-panel" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden backdrop-blur-xs">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="font-bold text-lg">Panel de Control</h3>
                <button onclick="toggleAdminPanel()" class="text-gray-400 hover:text-red-600"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="space-y-4">
                <div class="bg-gray-50 p-3 rounded-lg border">
                    <h4 class="font-bold text-xs uppercase mb-2">Configuración</h4>
                    <input type="text" id="cfg-whatsapp" placeholder="WhatsApp (Ej: 58412...)" class="w-full text-sm border p-2 rounded mb-2">
                    <input type="text" id="cfg-instagram" placeholder="Instagram (sin @)" class="w-full text-sm border p-2 rounded">
                </div>

                <div class="bg-gray-50 p-3 rounded-lg border">
                    <h4 class="font-bold text-xs uppercase mb-2">Nuevo Producto</h4>
                    <input type="text" id="prod-name" placeholder="Nombre" class="w-full text-sm border p-2 rounded mb-2">
                    <textarea id="prod-desc" placeholder="Descripción del producto..." class="w-full text-sm border p-2 rounded mb-2 h-20"></textarea>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input type="number" step="0.01" id="prod-price" placeholder="Precio $" class="w-full text-sm border p-2 rounded">
                        <select id="prod-category" class="w-full text-sm border p-2 rounded"></select>
                    </div>
                    <input type="text" id="prod-img" placeholder="URL de la imagen" class="w-full text-sm border p-2 rounded mb-3">
                    <button onclick="addProduct()" class="w-full bg-[#6BA4D9] text-white py-2 rounded font-bold hover:bg-blue-600">Registrar Producto</button>
                </div>

                <div class="flex gap-2">
                    <button onclick="saveConfig()" class="flex-grow bg-gray-800 text-white py-2 rounded text-sm font-bold">Guardar Cambios</button>
                    <button onclick="resetData()" class="bg-red-100 text-red-600 px-3 py-2 rounded" title="Reiniciar"><i class="fas fa-undo"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden backdrop-blur-xs">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[90vh] flex flex-col overflow-hidden">
            <div class="bg-gray-900 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold"><i class="fas fa-shopping-cart mr-2"></i> Mi Carrito</h3>
                <button onclick="toggleCartModal()" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div id="cart-items" class="p-4 flex-grow overflow-y-auto space-y-3"></div>
            <div class="p-4 border-t bg-gray-50">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-medium">Total:</span>
                    <span id="cart-total" class="text-xl font-bold">$0.00</span>
                </div>
                <button onclick="sendOrder()" class="w-full bg-[#25D366] text-white font-bold py-3 rounded-lg flex items-center justify-center">
                    <i class="fab fa-whatsapp mr-2 text-xl"></i> Pedir por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        const categories = ["Todos", "Tintes", "Shampoo", "Tratamientos", "Cuidado", "Accesorios"];
        const defaultSettings = {
            whatsapp: "584124630390",
            instagram: "distribuidoratheshampooca",
            password: "admin"
        };
        const defaultProducts = [
            { id: 1, name: "Tinte Igora Royal 6-0", price: 8.50, category: "Tintes", img: "", description: "Coloración permanente profesional." }
        ];

        let cart = [];
        let currentCategory = "Todos";
        let isAdminLoggedIn = false;

        if (!localStorage.getItem("ts_settings")) localStorage.setItem("ts_settings", JSON.stringify(defaultSettings));
        if (!localStorage.getItem("ts_products")) localStorage.setItem("ts_products", JSON.stringify(defaultProducts));

        function refreshUI() {
            const settings = JSON.parse(localStorage.getItem("ts_settings"));
            const products = JSON.parse(localStorage.getItem("ts_products"));

            document.getElementById("btn-insta-head").href = `https://instagram.com/${settings.instagram}`;
            document.getElementById("btn-wats-head").href = `https://wa.me/${settings.whatsapp}`;
            document.getElementById("cfg-whatsapp").value = settings.whatsapp;
            document.getElementById("cfg-instagram").value = settings.instagram;

            const catList = document.getElementById("category-list");
            catList.innerHTML = "";
            categories.forEach(cat => {
                const active = currentCategory === cat ? "bg-[#6BA4D9] text-white" : "bg-white text-gray-700 border-gray-300";
                catList.innerHTML += `<button onclick="filterCategory('${cat}')" class="px-4 py-1.5 rounded-full text-xs font-medium border shadow-sm cursor-pointer ${active}">${cat}</button>`;
            });

            const grid = document.getElementById("grid-productos");
            grid.innerHTML = "";
            const filtered = currentCategory === "Todos" ? products : products.filter(p => p.category === currentCategory);
            
            document.getElementById("product-count").innerText = `${filtered.length} Productos`;
            document.getElementById("no-products-msg").classList.toggle("hidden", filtered.length > 0);

            filtered.forEach(p => {
                const img = p.img || `https://placehold.co/400x400/f3f4f6/a3a3a3?text=${encodeURIComponent(p.name)}`;
                let delBtn = isAdminLoggedIn ? `<button onclick="deleteProduct(${p.id})" class="absolute top-2 right-2 bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center z-10"><i class="fas fa-trash-alt text-xs"></i></button>` : "";
                
                grid.innerHTML += `
                    <div class="bg-white rounded-lg border overflow-hidden shadow-xs relative flex flex-col group">
                        ${delBtn}
                        <div class="relative pt-[100%] bg-gray-100">
                            <img src="${img}" class="absolute inset-0 w-full h-full object-cover">
                        </div>
                        <div class="p-3 flex-grow flex flex-col">
                            <h3 class="text-sm font-bold text-gray-800 line-clamp-2 h-10 mb-1">${p.name}</h3>
                            <p class="text-[10px] text-gray-500 mb-2 line-clamp-2 italic">${p.description || ""}</p>
                            <div class="mt-auto flex items-center justify-between">
                                <span class="text-blue-700 font-bold">$${p.price.toFixed(2)}</span>
                                <button onclick="addToCart(${p.id})" class="bg-[#6BA4D9] text-white w-8 h-8 rounded-full flex items-center justify-center"><i class="fas fa-plus text-xs"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) { currentCategory = cat; refreshUI(); }

        function addProduct() {
            const name = document.getElementById("prod-name").value.trim();
            const desc = document.getElementById("prod-desc").value.trim();
            const price = parseFloat(document.getElementById("prod-price").value);
            const category = document.getElementById("prod-category").value;
            const img = document.getElementById("prod-img").value.trim();

            if (!name || isNaN(price)) return alert("Completa nombre y precio");

            const products = JSON.parse(localStorage.getItem("ts_products"));
            products.push({ id: Date.now(), name, description: desc, price, category, img });
            localStorage.setItem("ts_products", JSON.stringify(products));
            refreshUI();
            alert("Producto añadido");
        }

        function deleteProduct(id) {
            if(confirm("¿Eliminar producto?")) {
                let products = JSON.parse(localStorage.getItem("ts_products"));
                products = products.filter(p => p.id !== id);
                localStorage.setItem("ts_products", JSON.stringify(products));
                refreshUI();
            }
        }

        function saveConfig() {
            const w = document.getElementById("cfg-whatsapp").value.replace(/\D/g,'');
            const i = document.getElementById("cfg-instagram").value.trim();
            const settings = JSON.parse(localStorage.getItem("ts_settings"));
            localStorage.setItem("ts_settings", JSON.stringify({ ...settings, whatsapp: w, instagram: i }));
            refreshUI();
            toggleAdminPanel();
            alert("Configuración guardada");
        }

        function toggleAdminPanel() {
            const panel = document.getElementById("admin-panel");
            if (panel.classList.contains("hidden")) {
                if (prompt("Contraseña:") === JSON.parse(localStorage.getItem("ts_settings")).password) {
                    isAdminLoggedIn = true;
                    panel.classList.remove("hidden");
                } else alert("Error");
            } else { isAdminLoggedIn = false; panel.classList.add("hidden"); }
            refreshUI();
        }

        function toggleCartModal() { document.getElementById("cart-modal").classList.toggle("hidden"); }
        function addToCart(id) {
            const p = JSON.parse(localStorage.getItem("ts_products")).find(x => x.id === id);
            const exists = cart.find(x => x.id === id);
            if(exists) exists.qty++; else cart.push({...p, qty: 1});
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById("cart-items");
            container.innerHTML = cart.length ? "" : '<p class="text-center text-gray-400 py-4 text-xs">Carrito vacío</p>';
            let total = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                container.innerHTML += `<div class="flex justify-between border-b pb-2 text-xs"><span>${item.name} (x${item.qty})</span><b>$${(item.price * item.qty).toFixed(2)}</b></div>`;
            });
            document.getElementById("cart-total").innerText = `$${total.toFixed(2)}`;
            document.getElementById("cart-badge").innerText = cart.length;
            document.getElementById("cart-badge").classList.toggle("hidden", cart.length === 0);
        }

        function sendOrder() {
            const settings = JSON.parse(localStorage.getItem("ts_settings"));
            let msg = "*PEDIDO THE SHAMPOO*\n";
            cart.forEach(i => msg += `- ${i.name} (${i.qty})\n`);
            window.open(`https://wa.me/${settings.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function resetData() { if(confirm("¿Borrar todo?")) { localStorage.clear(); location.reload(); } }

        const selectCat = document.getElementById('prod-category');
        categories.filter(c => c !== "Todos").forEach(c => {
            let opt = document.createElement('option'); opt.value = c; opt.innerText = c;
            selectCat.appendChild(opt);
        });

        window.onload = refreshUI;
    </script>
</body></html>
