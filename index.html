<!DOCTYPE html>
<html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuidora The Shampoo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <header class="bg-white shadow-md sticky top-0 z-40">
        <div class="bg-[#D21427] h-2 w-full"></div> 
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-[#D21427] text-white p-2 rounded-lg shadow-md">
                    <i class="fas fa-store text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-gray-900">Distribuidora <span class="text-[#D21427]">The Shampoo</span></h1>
                    <p class="text-xs text-gray-500 font-medium flex items-center"><i class="fas fa-map-marker-alt text-[#D21427] mr-1"></i> Catálogo Online</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <a href="https://www.instagram.com/distribuidoratheshampooca?igsh=MXR4NmRsNDhya2g3OQ==" target="_blank" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-gray-600 hover:bg-pink-50 hover:text-pink-600 transition shadow-sm">
                    <i class="fab fa-instagram text-lg"></i>
                </a>
                <a href="https://wa.me/584124630390" target="_blank" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-gray-600 hover:bg-green-50 hover:text-green-600 transition shadow-sm">
                    <i class="fab fa-whatsapp text-lg"></i>
                </a>
                <button onclick="toggleAdminPanel()" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 transition shadow-sm" title="Panel de Administración">
                    <i class="fas fa-user-shield text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 flex flex-col md:flex-row gap-6">
        <div class="flex-grow w-full md:w-3/4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-6 space-y-4">
                <div class="relative">
                    <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                    <input type="text" id="search-input" oninput="searchProducts()" placeholder="Buscar productos por nombre o descripción..." class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:bg-white focus:ring-2 focus:ring-[#D21427] focus:border-transparent transition">
                </div>
                
                <div class="flex space-x-2 overflow-x-auto no-scrollbar pb-2">
                    <button onclick="filterCategory('Todos')" class="category-btn active px-4 py-2 rounded-full bg-[#D21427] text-white font-semibold whitespace-nowrap shadow-sm transition">Todos</button>
                    <button onclick="filterCategory('Champú')" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 font-semibold whitespace-nowrap shadow-sm hover:bg-gray-50 transition">Champú</button>
                    <button onclick="filterCategory('Acondicionador')" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 font-semibold whitespace-nowrap shadow-sm hover:bg-gray-50 transition">Acondicionador</button>
                    <button onclick="filterCategory('Ampollas')" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 font-semibold whitespace-nowrap shadow-sm hover:bg-gray-50 transition">Ampollas</button>
                    <button onclick="filterCategory('Tratamientos Capilares')" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 font-semibold whitespace-nowrap shadow-sm hover:bg-gray-50 transition">Tratamientos Capilares</button>
                    <button onclick="filterCategory('Sobrepeines')" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 font-semibold whitespace-nowrap shadow-sm hover:bg-gray-50 transition">Sobrepeines</button>
                    <button onclick="filterCategory('Tintes')" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 font-semibold whitespace-nowrap shadow-sm hover:bg-gray-50 transition">Tintes</button>
                    <button onclick="filterCategory('Oxidantes')" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 font-semibold whitespace-nowrap shadow-sm hover:bg-gray-50 transition">Oxidantes</button>
                    <button onclick="filterCategory('Polvos Decolorantes')" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 font-semibold whitespace-nowrap shadow-sm hover:bg-gray-50 transition">Polvos Decolorantes</button>
                    <button onclick="filterCategory('Desriz')" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 font-semibold whitespace-nowrap shadow-sm hover:bg-gray-50 transition">Desriz</button>
                    <button onclick="filterCategory('Ceras/Gel')" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 font-semibold whitespace-nowrap shadow-sm hover:bg-gray-50 transition">Ceras/Gel</button>
                    <button onclick="filterCategory('Lacas')" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 font-semibold whitespace-nowrap shadow-sm hover:bg-gray-50 transition">Lacas</button>
                    <button onclick="filterCategory('Línea Barbería')" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 font-semibold whitespace-nowrap shadow-sm hover:bg-gray-50 transition">Línea Barbería</button>
                    <button onclick="filterCategory('Herramientas')" class="category-btn px-4 py-2 rounded-full bg-white text-gray-600 border border-gray-200 font-semibold whitespace-nowrap shadow-sm hover:bg-gray-50 transition">Herramientas</button>
                </div>
            </div>

            <div id="admin-panel" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6 hidden space-y-4">
                <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                    <div class="flex items-center space-x-2 text-gray-900 font-bold text-lg">
                        <i class="fas fa-unlock-alt text-[#D21427]"></i>
                        <h2>Panel de Administración</h2>
                    </div>
                    <button onclick="logoutAdmin()" class="text-sm font-semibold text-red-600 hover:text-red-700 bg-red-50 px-3 py-1.5 rounded-lg transition">Cerrar Sesión</button>
                </div>
                <div class="flex flex-wrap gap-2 pt-2">
                    <button onclick="openAddModal()" class="flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2.5 rounded-xl shadow-sm transition">
                        <i class="fas fa-plus"></i>
                        <span>Añadir Producto</span>
                    </button>
                    <button onclick="downloadHTML()" class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2.5 rounded-xl shadow-sm transition">
                        <i class="fas fa-download"></i>
                        <span>Descargar HTML</span>
                    </button>
                    <button onclick="resetData()" class="flex items-center space-x-2 bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold px-4 py-2.5 rounded-xl transition" title="Restablecer Datos de Fábrica">
                        <i class="fas fa-undo"></i>
                        <span>Restablecer Base</span>
                    </button>
                </div>
            </div>

            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </div>

        <div class="w-full md:w-1/4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 sticky top-24 flex flex-col max-h-[calc(100vh-120px)]">
                <div class="flex items-center justify-between border-b border-gray-100 pb-3 mb-4">
                    <div class="flex items-center space-x-2 text-gray-900 font-bold">
                        <i class="fas fa-shopping-basket text-[#D21427] text-lg"></i>
                        <h2>Tu Pedido</h2>
                    </div>
                    <button onclick="clearCart()" class="text-xs font-semibold text-gray-400 hover:text-red-600 transition">Vaciar</button>
                </div>

                <div id="cart-items" class="flex-grow overflow-y-auto space-y-3 pr-1 no-scrollbar mb-4">
                    </div>

                <div class="border-t border-gray-100 pt-4 space-y-3">
                    <div class="flex items-center justify-between text-gray-900 font-bold text-lg">
                        <span>Total:</span>
                        <span id="cart-total" class="text-[#D21427]">$0.00</span>
                    </div>
                    <button onclick="sendWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#20ba5a] text-white font-bold py-3.5 rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2">
                        <i class="fab fa-whatsapp text-xl"></i>
                        <span>Enviar Pedido</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 mt-12 py-6 text-center text-sm text-gray-500">
        <p>© 2026 Distribuidora The Shampoo. Todos los derechos reservados.</p>
    </footer>

    <div id="product-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
            <div class="bg-gray-50 border-b border-gray-100 px-6 py-4 flex items-center justify-between">
                <h3 id="modal-title" class="text-gray-900 font-bold text-lg">Añadir Producto</h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-200 text-gray-500 hover:bg-gray-300 transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="product-form" onsubmit="saveProduct(); return false;" class="p-6 space-y-4">
                <input type="hidden" id="prod-id">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre del Producto</label>
                    <input type="text" id="prod-name" required class="w-full border border-gray-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[#D21427] transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Descripción</label>
                    <textarea id="prod-desc" required rows="2" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[#D21427] transition"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Precio ($)</label>
                        <input type="number" id="prod-price" step="0.01" required class="w-full border border-gray-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[#D21427] transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Categoría</label>
                        <select id="prod-category" required class="w-full border border-gray-200 rounded-xl p-2.5 bg-white outline-none focus:ring-2 focus:ring-[#D21427] transition">
                            <option value="Champú">Champú</option>
                            <option value="Acondicionador">Acondicionador</option>
                            <option value="Ampollas">Ampollas</option>
                            <option value="Tratamientos Capilares">Tratamientos Capilares</option>
                            <option value="Sobrepeines">Sobrepeines</option>
                            <option value="Tintes">Tintes</option>
                            <option value="Oxidantes">Oxidantes</option>
                            <option value="Polvos Decolorantes">Polvos Decolorantes</option>
                            <option value="Desriz">Desriz</option>
                            <option value="Ceras/Gel">Ceras/Gel</option>
                            <option value="Lacas">Lacas</option>
                            <option value="Línea Barbería">Línea Barbería</option>
                            <option value="Herramientas">Herramientas</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">URL de la Imagen</label>
                    <input type="url" id="prod-img" placeholder="https://ejemplo.com/imagen.jpg" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[#D21427] transition">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 border border-gray-200 rounded-xl text-gray-600 font-semibold hover:bg-gray-50 transition">Cancelar</button>
                    <button type="submit" class="px-5 py-2.5 bg-[#D21427] hover:bg-[#b0101f] text-white font-semibold rounded-xl shadow-sm transition">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="login-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl overflow-hidden animate-in fade-in zoom-in-95 duration-200">
            <div class="bg-gray-50 border-b border-gray-100 px-6 py-4 flex items-center justify-between">
                <h3 class="text-gray-900 font-bold text-lg">Ingreso Administrador</h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-200 text-gray-500 hover:bg-gray-300 transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="admin-pass" class="w-full border border-gray-200 rounded-xl p-2.5 outline-none focus:ring-2 focus:ring-[#D21427] transition" placeholder="Introduce la clave...">
                </div>
                <button onclick="loginAdmin()" class="w-full bg-[#D21427] hover:bg-[#b0101f] text-white font-semibold py-2.5 rounded-xl shadow-sm transition">Entrar</button>
            </div>
        </div>
    </div>

    <script>
        // Número de serie invisible que cambia con cada descarga para refrescar la memoria de los clientes
        const CATALOG_VERSION = "1717559160000";

        // Verificación de caché automática
        (function() {
            const localVersion = localStorage.getItem("ts_catalog_version");
            if (localVersion !== CATALOG_VERSION) {
                localStorage.removeItem("ts_products");
                localStorage.setItem("ts_catalog_version", CATALOG_VERSION);
            }
        })();

        const defaultProducts = [
            { id: 1, name: "Champú Brillo Intenso", desc: "Champú para todo tipo de cabello, aporta un brillo espectacular y limpieza profunda.", price: 5.50, category: "Champú", img: "https://images.unsplash.com/photo-1535585209827-a15fcdbc4c2d?w=500&auto=format&fit=crop&q=60" }
        ];

        const defaultSettings = {
            adminPass: "admin"
        };

        let currentCategory = "Todos";
        let cart = [];
        let isAdminLoggedIn = false;

        function refreshUI() {
            let products = JSON.parse(localStorage.getItem("ts_products"));
            if (!products) {
                products = defaultProducts;
                localStorage.setItem("ts_products", JSON.stringify(products));
            }

            let filtered = products;
            if (currentCategory !== "Todos") {
                filtered = products.filter(p => p.category === currentCategory);
            }

            const query = document.getElementById("search-input").value.toLowerCase().trim();
            if (query) {
                filtered = filtered.filter(p => p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query));
            }

            const grid = document.getElementById("product-grid");
            grid.innerHTML = "";

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 font-medium"><i class="fas fa-box-open text-4xl mb-2 block"></i> No se encontraron productos.</div>`;
            } else {
                filtered.forEach(p => {
                    const imgUrl = p.img || "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500&auto=format&fit=crop&q=60";
                    let adminButtons = "";
                    if (isAdminLoggedIn) {
                        adminButtons = `
                            <div class="absolute top-2 right-2 flex space-x-1 z-10">
                                <button onclick="openEditModal(${p.id})" class="bg-blue-600 text-white p-2 rounded-lg shadow hover:bg-blue-700 transition" title="Editar"><i class="fas fa-edit text-xs"></i></button>
                                <button onclick="deleteProduct(${p.id})" class="bg-red-600 text-white p-2 rounded-lg shadow hover:bg-red-700 transition" title="Eliminar"><i class="fas fa-trash text-xs"></i></button>
                            </div>
                        `;
                    }

                    grid.innerHTML += `
                        <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition relative flex flex-col group">
                            ${adminButtons}
                            <div class="relative aspect-square bg-gray-50 overflow-hidden">
                                <img src="${imgUrl}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <span class="absolute bottom-3 left-3 bg-white/90 backdrop-blur-xs text-xs font-bold px-2.5 py-1 rounded-full text-gray-700 border border-gray-100">${p.category}</span>
                            </div>
                            <div class="p-4 flex flex-col flex-grow justify-between space-y-3">
                                <div>
                                    <h3 class="font-bold text-gray-900 group-hover:text-[#D21427] transition line-clamp-1">${p.name}</h3>
                                    <p class="text-xs text-gray-500 mt-1 line-clamp-2">${p.desc}</p>
                                </div>
                                <div class="flex items-center justify-between pt-1">
                                    <span class="text-lg font-extrabold text-[#D21427]">$${p.price.toFixed(2)}</span>
                                    <button onclick="addToCart(${p.id})" class="bg-gray-900 hover:bg-[#D21427] text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-xs transition flex items-center space-x-1">
                                        <i class="fas fa-plus text-[10px]"></i>
                                        <span>Agregar</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            const panel = document.getElementById("admin-panel");
            if (isAdminLoggedIn) {
                panel.classList.remove("hidden");
            } else {
                panel.classList.add("hidden");
            }

            updateCartUI();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll(".category-btn").forEach(btn => {
                if (btn.getAttribute("onclick").includes(`'${cat}'`)) {
                    btn.classList.add("active", "bg-[#D21427]", "text-white");
                    btn.classList.remove("bg-white", "text-gray-600", "border-gray-200", "hover:bg-gray-50");
                } else {
                    btn.classList.remove("active", "bg-[#D21427]", "text-white");
                    btn.classList.add("bg-white", "text-gray-600", "border-gray-200", "hover:bg-gray-50");
                }
            });
            refreshUI();
        }

        function searchProducts() {
            refreshUI();
        }

        function addToCart(id) {
            let products = JSON.parse(localStorage.getItem("ts_products")) || defaultProducts;
            let prod = products.find(p => p.id === id);
            if (!prod) return;

            let item = cart.find(i => i.id === id);
            if (item) {
                item.qty += 1;
            } else {
                cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });
            }
            refreshUI();
        }

        function updateCartUI() {
            const container = document.getElementById("cart-items");
            container.innerHTML = "";
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400 text-xs font-medium"><i class="fas fa-shopping-cart text-2xl mb-1 block"></i> El pedido está vacío.</div>`;
            } else {
                cart.forEach(item => {
                    let subtotal = item.price * item.qty;
                    total += subtotal;
                    container.innerHTML += `
                        <div class="flex items-center justify-between bg-gray-50 p-2.5 rounded-xl border border-gray-100 space-x-2">
                            <div class="flex-grow min-w-0">
                                <h4 class="font-bold text-xs text-gray-900 truncate">${item.name}</h4>
                                <span class="text-[11px] font-semibold text-gray-400">$${item.price.toFixed(2)}</span>
                            </div>
                            <div class="flex items-center space-x-1.5 flex-shrink-0">
                                <button onclick="changeQuantity(${item.id}, -1)" class="w-5 h-5 flex items-center justify-center bg-white border border-gray-200 rounded text-xs text-gray-500 hover:bg-gray-100 transition"><i class="fas fa-minus text-[9px]"></i></button>
                                <span class="text-xs font-bold text-gray-800 w-4 text-center">${item.qty}</span>
                                <button onclick="changeQuantity(${item.id}, 1)" class="w-5 h-5 flex items-center justify-center bg-white border border-gray-200 rounded text-xs text-gray-500 hover:bg-gray-100 transition"><i class="fas fa-plus text-[9px]"></i></button>
                                <button onclick="removeFromCart(${item.id})" class="text-gray-300 hover:text-red-600 pl-1 transition" title="Quitar"><i class="fas fa-trash-alt text-[11px]"></i></button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById("cart-total").innerText = `$${total.toFixed(2)}`;
        }

        function changeQuantity(id, delta) {
            let item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            refreshUI();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            refreshUI();
        }

        function clearCart() {
            cart = [];
            refreshUI();
        }

        function sendWhatsApp() {
            if (cart.length === 0) return;
            let text = "¡Hola! Quisiera realizar el siguiente pedido:\n\n";
            let total = 0;
            cart.forEach(item => {
                let sub = item.price * item.qty;
                total += sub;
                text += `• ${item.qty}x ${item.name} ($${item.price.toFixed(2)} c/u) -> $${sub.toFixed(2)}\n`;
            });
            text += `\n*Total a Pagar: $${total.toFixed(2)}*`;
            
            const phone = "584124630390";
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
            window.open(url, "_blank");
        }

        function toggleAdminPanel() {
            if (isAdminLoggedIn) {
                document.getElementById("admin-panel").scrollIntoView({ behavior: 'smooth' });
            } else {
                document.getElementById("admin-pass").value = "";
                document.getElementById("login-modal").classList.remove("hidden");
            }
        }

        function loginAdmin() {
            const pass = document.getElementById("admin-pass").value;
            let settings = JSON.parse(localStorage.getItem("ts_settings")) || defaultSettings;
            if (pass === settings.adminPass) {
                isAdminLoggedIn = true;
                closeModal();
                refreshUI();
                setTimeout(() => {
                    document.getElementById("admin-panel").scrollIntoView({ behavior: 'smooth' });
                }, 100);
            } else {
                alert("Clave incorrecta.");
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            refreshUI();
        }

        function openAddModal() {
            document.getElementById("product-form").reset();
            document.getElementById("prod-id").value = "";
            document.getElementById("modal-title").innerText = "Añadir Producto";
            document.getElementById("product-modal").classList.remove("hidden");
        }

        function openEditModal(id) {
            let products = JSON.parse(localStorage.getItem("ts_products")) || defaultProducts;
            let prod = products.find(p => p.id === id);
            if (!prod) return;

            document.getElementById("prod-id").value = prod.id;
            document.getElementById("prod-name").value = prod.name;
            document.getElementById("prod-desc").value = prod.desc;
            document.getElementById("prod-price").value = prod.price;
            document.getElementById("prod-category").value = prod.category;
            document.getElementById("prod-img").value = prod.img || "";

            document.getElementById("modal-title").innerText = "Editar Producto";
            document.getElementById("product-modal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("product-modal").classList.add("hidden");
            document.getElementById("login-modal").classList.add("hidden");
        }

        function saveProduct() {
            const idVal = document.getElementById("prod-id").value;
            const name = document.getElementById("prod-name").value;
            const desc = document.getElementById("prod-desc").value;
            const price = parseFloat(document.getElementById("prod-price").value);
            const category = document.getElementById("prod-category").value;
            const img = document.getElementById("prod-img").value;

            let products = JSON.parse(localStorage.getItem("ts_products")) || defaultProducts;

            if (idVal) {
                let idx = products.findIndex(p => p.id === parseInt(idVal));
                if (idx !== -1) {
                    products[idx] = { id: parseInt(idVal), name, desc, price, category, img };
                }
            } else {
                let newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
                products.push({ id: newId, name, desc, price, category, img });
            }

            localStorage.setItem("ts_products", JSON.stringify(products));
            closeModal();
            refreshUI();
        }

        function deleteProduct(id) {
            if (confirm("¿Seguro que deseas eliminar este producto?")) {
                let products = JSON.parse(localStorage.getItem("ts_products"));
                products = products.filter(p => p.id !== id);
                localStorage.setItem("ts_products", JSON.stringify(products));
                refreshUI();
            }
        }

        function resetData() {
            if (confirm("Se borrarán tus modificaciones y volverán los productos muestra. ¿Proceder?")) {
                localStorage.clear();
                localStorage.setItem("ts_settings", JSON.stringify(defaultSettings));
                localStorage.setItem("ts_products", JSON.stringify(defaultProducts));
                currentCategory = "Todos";
                cart = [];
                isAdminLoggedIn = false;
                closeModal();
                filterCategory("Todos");
            }
        }

        function downloadHTML() {
            const products = localStorage.getItem("ts_products") || JSON.stringify(defaultProducts);
            let htmlContent = document.documentElement.outerHTML;
            
            // Genera el número de serie único invisible basado en el tiempo exacto
            const newSerial = Date.now().toString();
            
            // Reemplaza los productos por defecto por los actuales modificados
            const regexProducts = /const defaultProducts = \[\{[\s\S]*?\}\];|const defaultProducts = \[[\s\S]*?\];/;
            htmlContent = htmlContent.replace(regexProducts, `const defaultProducts = ${products};`);
            
            // Estampa el número de serie en la constante CATALOG_VERSION dentro del archivo que se descarga
            const regexVersion = /const CATALOG_VERSION = "[^"]*";/;
            htmlContent = htmlContent.replace(regexVersion, `const CATALOG_VERSION = "${newSerial}";`);
            
            const blob = new Blob(["<!DOCTYPE html>\n" + htmlContent], { type: "text/html" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "index.html";
            a.click();
        }

        window.onload = function() { refreshUI(); };
    </script>
</body></html>
